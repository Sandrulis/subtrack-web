name: Security audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # L1 – iknedēļas atkarību pārbaude (pirmdiena 06:00 UTC)
    - cron: "0 6 * * 1"

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: L2 regression (static)
        run: npm run security:regression-check
      - name: npm audit (--audit-level high)
        run: npm run audit
